<!doctype html>
<!-- Lumen Maze: gather every crystal, wake the portal, and escape the maze
     before the shadows catch your light. A complete game in plain static
     files: no library, no network request, keyboard and mouse. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumen Maze</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="Lumen Maze: move the light through the maze, gather crystals, avoid the shadow sentries, and reach the portal"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
